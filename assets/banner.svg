<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Animated banner: two emerald serpents coil around the frame of Argyrys, Keeper of the Code, House Slytherin">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#040a07"/>
      <stop offset="0.5" stop-color="#0d2b1d"/>
      <stop offset="1" stop-color="#040a07"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="62%">
      <stop offset="0" stop-color="#27ae60" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#27ae60" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="candleGlow">
      <stop offset="0" stop-color="#ffd36b" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffd36b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff8dd" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e9b0"/>
      <stop offset="0.45" stop-color="#c8aa6e"/>
      <stop offset="1" stop-color="#8a6f37"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#36b56d"/>
      <stop offset="0.45" stop-color="#166a3d"/>
      <stop offset="1" stop-color="#072b19"/>
    </linearGradient>
    <pattern id="stars" width="113" height="89" patternUnits="userSpaceOnUse">
      <circle cx="17" cy="22" r="1.3" fill="#e8dcae" opacity="0.4"/>
      <circle cx="81" cy="61" r="1" fill="#e8dcae" opacity="0.3"/>
      <circle cx="54" cy="13" r="0.8" fill="#7fe3a8" opacity="0.4"/>
      <circle cx="103" cy="37" r="0.7" fill="#e8dcae" opacity="0.25"/>
    </pattern>
    <pattern id="scales" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(14)">
      <rect width="10" height="10" fill="#0f4a2c"/>
      <path d="M5 1 l4 4 -4 4 -4 -4 Z" fill="#1e804b" stroke="#31a869" stroke-width="0.6"/>
      <path d="M0 6 l1 1 M10 6 l-1 1" stroke="#072819" stroke-width="0.8"/>
    </pattern>
    <mask id="titleMask">
      <rect width="1200" height="300" fill="#000"/>
      <text x="600" y="163" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="700" letter-spacing="15" fill="#fff">ARGYRYS</text>
    </mask>

    <g id="serpent">
      <g class="coil">
        <!-- tail -->
        <path d="M34 268 C 18 246, 48 218, 40 188" fill="none" stroke="#010805" stroke-opacity="0.55" stroke-width="13" stroke-linecap="round" transform="translate(3,4)"/>
        <path d="M34 268 C 18 246, 48 218, 40 188" fill="none" stroke="url(#gold)" stroke-opacity="0.7" stroke-width="10" stroke-linecap="round"/>
        <path d="M34 268 C 18 246, 48 218, 40 188" fill="none" stroke="#0c3c24" stroke-width="8" stroke-linecap="round"/>
        <path d="M34 268 C 18 246, 48 218, 40 188" fill="none" stroke="url(#scales)" stroke-width="5" stroke-linecap="round"/>
        <path d="M34 268 C 18 246, 48 218, 40 188" fill="none" stroke="#8ff0b8" stroke-opacity="0.4" stroke-width="1.4" stroke-linecap="round" transform="translate(-2,-2)"/>

        <!-- body rising along the left border and curling over the corner -->
        <path d="M40 188 C 30 158, 60 134, 50 104 C 40 74, 68 46, 102 46" fill="none" stroke="#010805" stroke-opacity="0.55" stroke-width="20" stroke-linecap="round" transform="translate(3,4)"/>
        <path d="M40 188 C 30 158, 60 134, 50 104 C 40 74, 68 46, 102 46" fill="none" stroke="url(#gold)" stroke-opacity="0.75" stroke-width="17" stroke-linecap="round"/>
        <path d="M40 188 C 30 158, 60 134, 50 104 C 40 74, 68 46, 102 46" fill="none" stroke="#0c3c24" stroke-width="15" stroke-linecap="round"/>
        <path d="M40 188 C 30 158, 60 134, 50 104 C 40 74, 68 46, 102 46" fill="none" stroke="url(#scales)" stroke-width="12" stroke-linecap="round"/>
        <path d="M40 188 C 30 158, 60 134, 50 104 C 40 74, 68 46, 102 46" fill="none" stroke="#8ff0b8" stroke-opacity="0.38" stroke-width="1.8" stroke-linecap="round" transform="translate(-2,-2)"/>

        <!-- loop and neck reaching inward -->
        <path d="M102 46 C 134 46, 154 64, 148 86 C 142 106, 116 104, 112 86 C 108 68, 134 54, 160 56" fill="none" stroke="#010805" stroke-opacity="0.55" stroke-width="16" stroke-linecap="round" transform="translate(3,4)"/>
        <path d="M102 46 C 134 46, 154 64, 148 86 C 142 106, 116 104, 112 86 C 108 68, 134 54, 160 56" fill="none" stroke="url(#gold)" stroke-opacity="0.75" stroke-width="13" stroke-linecap="round"/>
        <path d="M102 46 C 134 46, 154 64, 148 86 C 142 106, 116 104, 112 86 C 108 68, 134 54, 160 56" fill="none" stroke="#0c3c24" stroke-width="11" stroke-linecap="round"/>
        <path d="M102 46 C 134 46, 154 64, 148 86 C 142 106, 116 104, 112 86 C 108 68, 134 54, 160 56" fill="none" stroke="url(#scales)" stroke-width="8" stroke-linecap="round"/>
        <path d="M102 46 C 134 46, 154 64, 148 86 C 142 106, 116 104, 112 86 C 108 68, 134 54, 160 56" fill="none" stroke="#8ff0b8" stroke-opacity="0.38" stroke-width="1.5" stroke-linecap="round" transform="translate(-2,-2)"/>

        <!-- light traveling along the coiled body -->
        <path class="body-sheen" d="M34 268 C 18 246, 48 218, 40 188 C 30 158, 60 134, 50 104 C 40 74, 68 46, 102 46 C 134 46, 154 64, 148 86 C 142 106, 116 104, 112 86 C 108 68, 134 54, 160 56" fill="none" stroke="#fff6d5" stroke-opacity="0.3" stroke-width="13" stroke-linecap="round"/>

        <!-- head -->
        <g class="head">
          <path d="M150 48 l-7 -9 11 4 Z" fill="url(#gold)"/>
          <path d="M150 62 l-8 7 12 -3 Z" fill="url(#gold)"/>
          <path d="M148 49 C160 43 176 43 188 49 C195 52 197 57 191 61 C181 68 161 68 148 62 Z" fill="url(#headGrad)" stroke="url(#gold)" stroke-width="2"/>
          <path d="M153 60 C167 65 182 64 191 60" fill="none" stroke="#062719" stroke-width="1.4"/>
          <path d="M165 48 q8 -4 14 0" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-linecap="round"/>
          <g class="eye">
            <ellipse cx="173" cy="52" rx="4.2" ry="3.4" fill="#f7e9b0"/>
            <ellipse cx="174" cy="52" rx="1.2" ry="2.8" fill="#04120a"/>
            <circle cx="175" cy="50.8" r="0.9" fill="#ffffff" opacity="0.85"/>
          </g>
          <circle cx="188" cy="55" r="1.1" fill="#04120a"/>
          <path class="tongue" d="M193 61 C202 62 207 66 213 64 M207 65 l6 -3 M207 65 l5 4" fill="none" stroke="#e05a68" stroke-width="1.6" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </defs>

  <style>
    .aura { animation: auraPulse 5.5s ease-in-out infinite; }
    .star { animation: twinkle 3.2s ease-in-out infinite; }
    .sheen { animation: sheenSweep 7s ease-in-out infinite; }
    .serpent-left { animation: outerFloat 9s ease-in-out infinite; }
    .serpent-right { animation: outerFloat 9s ease-in-out infinite; animation-delay: -4.5s; }
    .coil { transform-box: view-box; transform-origin: 120px 160px; animation: coilSway 8.5s ease-in-out infinite; }
    .head { transform-box: view-box; transform-origin: 158px 56px; animation: headSway 5.2s ease-in-out infinite; }
    .tongue { transform-box: view-box; transform-origin: 193px 61px; animation: tongueFlick 2.6s ease-in-out infinite; }
    .eye { animation: eyeBlink 6.8s ease-in-out infinite; }
    .body-sheen { stroke-dasharray: 38 900; animation: bodySheen 7.5s linear infinite; }
    .candle-a { animation: driftA 7s ease-in-out infinite; }
    .candle-b { animation: driftB 8.5s ease-in-out infinite; }
    .candle-c { animation: driftC 9s ease-in-out infinite; }
    .candle-d { animation: driftD 7.8s ease-in-out infinite; }
    .flame { transform-box: fill-box; transform-origin: center bottom; animation: flicker 0.9s ease-in-out infinite alternate; }
    .flame-glow { animation: glowPulse 1.6s ease-in-out infinite; }
    @keyframes auraPulse { 0%,100% { opacity: 0.65; } 50% { opacity: 1; } }
    @keyframes twinkle { 0%,100% { opacity: 0.15; } 50% { opacity: 1; } }
    @keyframes sheenSweep { 0% { transform: translateX(-320px); } 60%,100% { transform: translateX(960px); } }
    @keyframes outerFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    @keyframes coilSway {
      0%,100% { transform: translate(0,0) rotate(0deg) scale(1); }
      33% { transform: translate(2px,-2px) rotate(1deg) scale(1.008); }
      66% { transform: translate(-2px,2px) rotate(-1deg) scale(0.995); }
    }
    @keyframes headSway { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(4deg) translateY(-2px); } }
    @keyframes tongueFlick {
      0%,82%,100% { transform: scaleX(0.5) rotate(0deg); opacity: 0.7; }
      86% { transform: scaleX(1) rotate(8deg); opacity: 1; }
      90% { transform: scaleX(0.5) rotate(-6deg); opacity: 0.8; }
    }
    @keyframes eyeBlink { 0%,92%,100% { opacity: 1; } 94% { opacity: 0.05; } 96% { opacity: 1; } }
    @keyframes bodySheen { from { stroke-dashoffset: 938; } to { stroke-dashoffset: -38; } }
    @keyframes driftA { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }
    @keyframes driftB { 0%,100% { transform: translateY(-8px); } 50% { transform: translateY(8px); } }
    @keyframes driftC { 0%,100% { transform: translateY(2px); } 50% { transform: translateY(-14px); } }
    @keyframes driftD { 0%,100% { transform: translateY(-12px); } 50% { transform: translateY(3px); } }
    @keyframes flicker { 0% { transform: scale(0.9,1.08); opacity: 0.9; } 100% { transform: scale(1.08,0.92); opacity: 1; } }
    @keyframes glowPulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
  </style>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect class="aura" width="1200" height="300" fill="url(#glow)"/>
  <rect width="1200" height="300" fill="url(#stars)"/>

  <g class="star" style="animation-delay:-0.2s"><circle cx="95" cy="58" r="1.8" fill="#e8dcae"/></g>
  <g class="star" style="animation-delay:-1.4s"><circle cx="212" cy="96" r="1.6" fill="#7fe3a8"/></g>
  <g class="star" style="animation-delay:-2.6s"><circle cx="325" cy="47" r="1.5" fill="#e8dcae"/></g>
  <g class="star" style="animation-delay:-0.9s"><circle cx="438" cy="112" r="1.7" fill="#f7e9b0"/></g>
  <g class="star" style="animation-delay:-2.1s"><circle cx="525" cy="39" r="1.4" fill="#7fe3a8"/></g>
  <g class="star" style="animation-delay:-1.8s"><circle cx="672" cy="106" r="1.6" fill="#e8dcae"/></g>
  <g class="star" style="animation-delay:-0.5s"><circle cx="768" cy="52" r="1.8" fill="#f7e9b0"/></g>
  <g class="star" style="animation-delay:-3s"><circle cx="868" cy="118" r="1.5" fill="#7fe3a8"/></g>
  <g class="star" style="animation-delay:-1.1s"><circle cx="1012" cy="62" r="1.7" fill="#e8dcae"/></g>
  <g class="star" style="animation-delay:-2.4s"><circle cx="1118" cy="104" r="1.6" fill="#f7e9b0"/></g>
  <g class="star" style="animation-delay:-0.7s"><circle cx="148" cy="178" r="1.4" fill="#7fe3a8"/></g>
  <g class="star" style="animation-delay:-2.9s"><circle cx="1058" cy="192" r="1.5" fill="#e8dcae"/></g>

  <rect x="14" y="14" width="1172" height="272" rx="10" fill="none" stroke="url(#gold)" stroke-width="2"/>
  <rect x="23" y="23" width="1154" height="254" rx="6" fill="none" stroke="#c8aa6e" stroke-opacity="0.35"/>

  <path d="M40 76 V40 H76 M1124 40 H1160 V76 M40 224 V260 H76 M1124 260 H1160 V224" fill="none" stroke="url(#gold)" stroke-width="2"/>
  <path d="M40 40 l18 18 M1160 40 l-18 18 M40 260 l18 -18 M1160 260 l-18 -18" stroke="#c8aa6e" stroke-opacity="0.6" stroke-width="1.5"/>

  <g class="serpent-left"><use href="#serpent"/></g>
  <g transform="translate(1200,0) scale(-1,1)"><g class="serpent-right"><use href="#serpent"/></g></g>

  <g transform="translate(105,150)"><g class="candle-a">
    <circle class="flame-glow" cx="0" cy="-10" r="26" fill="url(#candleGlow)"/>
    <rect x="-5" y="0" width="10" height="32" rx="3" fill="#e8d7a6" opacity="0.9"/>
    <path d="M0 0 v-6" stroke="#2b241a" stroke-width="1.6"/>
    <ellipse class="flame" cx="0" cy="-13" rx="4.6" ry="9" fill="#f7b94f" style="animation-delay:-0.2s"/>
    <ellipse class="flame" cx="0" cy="-14" rx="2" ry="5" fill="#fff4c2" style="animation-delay:-0.5s"/>
  </g></g>
  <g transform="translate(258,204)"><g class="candle-b">
    <circle class="flame-glow" cx="0" cy="-10" r="24" fill="url(#candleGlow)" style="animation-delay:-0.7s"/>
    <rect x="-4.5" y="0" width="9" height="28" rx="3" fill="#e8d7a6" opacity="0.85"/>
    <path d="M0 0 v-6" stroke="#2b241a" stroke-width="1.5"/>
    <ellipse class="flame" cx="0" cy="-13" rx="4" ry="8" fill="#f7b94f" style="animation-delay:-0.4s"/>
    <ellipse class="flame" cx="0" cy="-14" rx="1.8" ry="4.5" fill="#fff4c2" style="animation-delay:-0.8s"/>
  </g></g>
  <g transform="translate(942,202)"><g class="candle-c">
    <circle class="flame-glow" cx="0" cy="-10" r="25" fill="url(#candleGlow)" style="animation-delay:-1.1s"/>
    <rect x="-4.5" y="0" width="9" height="30" rx="3" fill="#e8d7a6" opacity="0.88"/>
    <path d="M0 0 v-6" stroke="#2b241a" stroke-width="1.5"/>
    <ellipse class="flame" cx="0" cy="-13" rx="4.2" ry="8.5" fill="#f7b94f" style="animation-delay:-0.6s"/>
    <ellipse class="flame" cx="0" cy="-14" rx="1.9" ry="4.7" fill="#fff4c2" style="animation-delay:-0.3s"/>
  </g></g>
  <g transform="translate(1095,148)"><g class="candle-d">
    <circle class="flame-glow" cx="0" cy="-10" r="26" fill="url(#candleGlow)" style="animation-delay:-0.4s"/>
    <rect x="-5" y="0" width="10" height="32" rx="3" fill="#e8d7a6" opacity="0.9"/>
    <path d="M0 0 v-6" stroke="#2b241a" stroke-width="1.6"/>
    <ellipse class="flame" cx="0" cy="-13" rx="4.6" ry="9" fill="#f7b94f" style="animation-delay:-0.9s"/>
    <ellipse class="flame" cx="0" cy="-14" rx="2" ry="5" fill="#fff4c2" style="animation-delay:-0.1s"/>
  </g></g>

  <text x="600" y="82" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" letter-spacing="8" fill="#7fe3a8">✦  HOUSE SLYTHERIN  ✦</text>
  <text x="600" y="163" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="700" letter-spacing="15" fill="url(#gold)">ARGYRYS</text>
  <g mask="url(#titleMask)"><rect class="sheen" x="200" y="55" width="190" height="135" fill="url(#sheenGrad)"/></g>
  <path d="M400 186 H800" stroke="url(#gold)" stroke-width="1.5" opacity="0.8"/>
  <path d="M600 178 l8 8 -8 8 -8 -8 Z" fill="#c8aa6e"/>
  <text x="600" y="222" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="23" letter-spacing="7" fill="#d7dfd8">KEEPER OF THE CODE</text>
  <text x="600" y="254" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="4" fill="#93a89a">AMBITION · CUNNING · CRAFTSMANSHIP</text>
</svg>
