<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Argyrys, Keeper of the Code, House Slytherin">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#040a07"/>
      <stop offset="0.5" stop-color="#0d2b1d"/>
      <stop offset="1" stop-color="#040a07"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="62%">
      <stop offset="0" stop-color="#27ae60" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#27ae60" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e9b0"/>
      <stop offset="0.45" stop-color="#c8aa6e"/>
      <stop offset="1" stop-color="#8a6f37"/>
    </linearGradient>
    <pattern id="stars" width="113" height="89" patternUnits="userSpaceOnUse">
      <circle cx="17" cy="22" r="1.3" fill="#e8dcae" opacity="0.55"/>
      <circle cx="81" cy="61" r="1" fill="#e8dcae" opacity="0.4"/>
      <circle cx="54" cy="13" r="0.8" fill="#7fe3a8" opacity="0.55"/>
      <circle cx="103" cy="37" r="0.7" fill="#e8dcae" opacity="0.35"/>
    </pattern>
    <g id="serpent">
      <path d="M8 232 C-32 210 -20 159 18 150 C58 141 66 102 30 89 C6 80 -4 105 14 116" fill="none" stroke="url(#gold)" stroke-width="13" stroke-linecap="round"/>
      <path d="M8 232 C-32 210 -20 159 18 150 C58 141 66 102 30 89 C6 80 -4 105 14 116" fill="none" stroke="#27ae60" stroke-width="7" stroke-linecap="round"/>
      <ellipse cx="17" cy="116" rx="18" ry="12" fill="#27ae60" stroke="url(#gold)" stroke-width="3" transform="rotate(-25 17 116)"/>
      <circle cx="12" cy="112" r="2.6" fill="#f7e9b0"/>
      <path d="M2 121 l-14 5 M2 121 l-12 -6" stroke="#c8aa6e" stroke-width="2" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <rect width="1200" height="300" fill="url(#stars)"/>

  <rect x="14" y="14" width="1172" height="272" rx="10" fill="none" stroke="url(#gold)" stroke-width="2"/>
  <rect x="23" y="23" width="1154" height="254" rx="6" fill="none" stroke="#c8aa6e" stroke-opacity="0.35"/>

  <path d="M40 76 V40 H76 M1124 40 H1160 V76 M40 224 V260 H76 M1124 260 H1160 V224" fill="none" stroke="url(#gold)" stroke-width="2"/>
  <path d="M40 40 l18 18 M1160 40 l-18 18 M40 260 l18 -18 M1160 260 l-18 -18" stroke="#c8aa6e" stroke-opacity="0.6" stroke-width="1.5"/>

  <use href="#serpent" x="150" y="0"/>
  <g transform="translate(1200,0) scale(-1,1)"><use href="#serpent" x="150" y="0"/></g>

  <text x="600" y="82" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" letter-spacing="8" fill="#7fe3a8">✦  HOUSE SLYTHERIN  ✦</text>
  <text x="600" y="163" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="700" letter-spacing="15" fill="url(#gold)">ARGYRYS</text>
  <path d="M400 186 H800" stroke="url(#gold)" stroke-width="1.5" opacity="0.8"/>
  <path d="M600 178 l8 8 -8 8 -8 -8 Z" fill="#c8aa6e"/>
  <text x="600" y="222" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="23" letter-spacing="7" fill="#d7dfd8">KEEPER OF THE CODE</text>
  <text x="600" y="254" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="4" fill="#93a89a">AMBITION · CUNNING · CRAFTSMANSHIP</text>
</svg>
