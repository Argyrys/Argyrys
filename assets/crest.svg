<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 290" width="240" height="290" role="img" aria-label="Animated original Slytherin-inspired serpent crest with the letter A">
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12402a"/>
      <stop offset="0.55" stop-color="#0a2418"/>
      <stop offset="1" stop-color="#040d08"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e9b0"/>
      <stop offset="0.5" stop-color="#c8aa6e"/>
      <stop offset="1" stop-color="#8a6f37"/>
    </linearGradient>
    <radialGradient id="auraGrad">
      <stop offset="0" stop-color="#27ae60" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#27ae60" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#27ae60" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .aura { transform-box: fill-box; transform-origin: center; animation: auraPulse 4.6s ease-in-out infinite; }
    .letter { animation: letterGlow 6s ease-in-out infinite; }
    .serpent-left { transform-box: fill-box; transform-origin: center; animation: floatLeft 5.4s ease-in-out infinite; }
    .serpent-right { transform-box: fill-box; transform-origin: center; animation: floatRight 6.1s ease-in-out infinite; }
    .eye { animation: eyeBlink 7s ease-in-out infinite; }
    .eye-right { animation-delay: -3.4s; }
    @keyframes auraPulse { 0%,100% { opacity: 0.6; transform: scale(0.94); } 50% { opacity: 1; transform: scale(1.08); } }
    @keyframes letterGlow { 0%,100% { opacity: 0.78; } 50% { opacity: 1; } }
    @keyframes floatLeft { 0%,100% { transform: translate(0,0) rotate(0deg); } 50% { transform: translate(1.5px,-3px) rotate(-1.2deg); } }
    @keyframes floatRight { 0%,100% { transform: translate(0,-2px) rotate(0deg); } 50% { transform: translate(-1.5px,2px) rotate(1.2deg); } }
    @keyframes eyeBlink { 0%,93%,100% { opacity: 1; } 95% { opacity: 0.05; } 97% { opacity: 1; } }
  </style>

  <circle class="aura" cx="120" cy="145" r="112" fill="url(#auraGrad)"/>

  <path d="M120 10 L218 46 V142 C218 202 176 248 120 274 C64 248 22 202 22 142 V46 Z" fill="url(#shield)" stroke="url(#gold)" stroke-width="5"/>
  <path d="M120 24 L204 55 V141 C204 193 168 234 120 258 C72 234 36 193 36 141 V55 Z" fill="none" stroke="#c8aa6e" stroke-opacity="0.5" stroke-width="1.5"/>

  <text class="letter" x="120" y="157" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="116" font-weight="700" fill="url(#gold)">A</text>

  <g class="serpent-left">
    <path d="M64 216 C40 194 52 162 78 160 C106 158 116 132 94 120 C76 110 66 128 80 136" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>
    <path d="M64 216 C40 194 52 162 78 160 C106 158 116 132 94 120 C76 110 66 128 80 136" fill="none" stroke="#27ae60" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="82" cy="137" rx="14" ry="9" fill="#27ae60" stroke="url(#gold)" stroke-width="2.5" transform="rotate(-30 82 137)"/>
    <circle class="eye" cx="77" cy="134" r="2.2" fill="#f7e9b0"/>
  </g>

  <g class="serpent-right">
    <path d="M176 216 C200 194 188 162 162 160 C134 158 124 132 146 120 C164 110 174 128 160 136" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>
    <path d="M176 216 C200 194 188 162 162 160 C134 158 124 132 146 120 C164 110 174 128 160 136" fill="none" stroke="#27ae60" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="158" cy="137" rx="14" ry="9" fill="#27ae60" stroke="url(#gold)" stroke-width="2.5" transform="rotate(30 158 137)"/>
    <circle class="eye eye-right" cx="163" cy="134" r="2.2" fill="#f7e9b0"/>
  </g>

  <rect x="46" y="242" width="148" height="28" rx="4" fill="#071710" stroke="url(#gold)" stroke-width="2"/>
  <text x="120" y="261" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" letter-spacing="5" fill="#d4b779">SLYTHERIN</text>
</svg>
